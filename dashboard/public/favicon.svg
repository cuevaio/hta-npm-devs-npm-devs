<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="32" height="32">
  <!-- Favicon: el símbolo sobre tinta, con módulos macizos (sin separación)
       porque se ve por debajo de 48 px. -->
  <rect width="140" height="140" rx="26" fill="#000201"/>
  <g fill="#F7F8F2">
    <rect x="20" y="20" width="20" height="20"/>
    <rect x="40" y="40" width="20" height="20"/>
    <rect x="20" y="60" width="20" height="20"/>
    <rect x="40" y="60" width="20" height="20"/>
    <rect x="40" y="80" width="20" height="20"/>
    <rect x="20" y="100" width="20" height="20"/>
  </g>
  <g fill="#D8F36A">
    <rect x="60" y="60" width="20" height="20"/>
    <rect x="80" y="60" width="20" height="20"/>
    <rect x="100" y="60" width="20" height="20"/>
  </g>
</svg>
