[project]
name = "fleet-backend"
version = "0.1.0"
description = "Domain API de Fleet Intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
